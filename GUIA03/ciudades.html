<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interacción con menús de selección</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="js/ciudades.js"></script>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-center mb-4">Selector de destino de vacaciones</h1>

    <form name="testform" id="testform">

        <div class="mb-3">
            <label class="form-label">País</label>

            <select name="country" id="country" class="form-select">
                <option selected>Italia</option>
                <option>Francia</option>
                <option>España</option>
                <option>Estados Unidos</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Ciudad</label>

            <select name="city" id="city" class="form-select" size="5">
                <option>Roma</option>
                <option>Turín</option>
                <option>Milán</option>
                <option>Venecia</option>
                <option>Verona</option>
            </select>
        </div>

        <input
            type="button"
            id="btnagregar"
            value="Agregar ciudad"
            class="btn btn-primary">

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
