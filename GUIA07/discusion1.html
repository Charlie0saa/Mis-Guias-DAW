<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Discusión 1 - Validador con RegExp</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/discusion1.js"></script>
</head>
<body>
    <div class="container">
        <div class="m-4 d-flex h-100 w-100 justify-content-center align-items-center">
            <div class="col-auto bg-light p-5 rounded shadow-sm">
                <form action="javascript:void(0)" name="frmdatos" id="dataform">
                    <h2 class="mb-4 text-center">Validador de IP, URL y Email</h2>

                    <div class="input-group p-2">
                        <label class="form-label" for="tipo">Seleccione el tipo de dato:</label>&nbsp;&nbsp;
                        <select class="form-select" name="seltipo" id="tipo">
                            <option value="ipv4" selected>Dirección IPv4</option>
                            <option value="url">Dirección Web (URL)</option>
                            <option value="email">Correo Electrónico</option>
                        </select>
                    </div>

                    <div class="input-group p-2">
                        <label class="form-label" for="data">Dato:</label>&nbsp;&nbsp;
                        <input class="form-control" type="text" name="txtdato" id="data" value="" placeholder="(Ingrese el valor a validar)" /><br />
                    </div>

                    <input class="w-100 btn btn-primary mt-2" type="button" name="btnvalidar" id="validar" value="Validar" />
                </form>
            </div>
        </div>
    </div>
</body>
</html>
