<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Discusión 2 - Validador de Imágenes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/discusion2.js"></script>
</head>
<body>
    <div class="container">
        <div class="m-4 d-flex h-100 w-100 justify-content-center align-items-center">
            <div class="col-auto bg-light p-5 rounded shadow-sm text-center">
                <h2>Subir Imagen</h2>
                <p class="text-muted">Formatos permitidos: .jpg, .jpeg, .png, .gif</p>

                <form action="javascript:void(0)" name="frmfile" id="frmfile">
                    <div class="mb-3">
                        <!-- Input tipo file oculto -->
                        <input type="file" id="fileInput" name="fileInput" class="d-none" />
                        
                        <!-- Label que simula el botón del input file -->
                        <label for="fileInput" class="btn btn-outline-primary btn-lg custom-file-upload">
                            Seleccionar Archivo
                        </label>
                    </div>

                    <!-- Contenedor para mostrar el nombre del archivo seleccionado -->
                    <div class="mb-3">
                        <span id="fileName" class="fw-bold text-secondary">Ningún archivo seleccionado</span>
                    </div>

                    <input class="w-100 btn btn-success" type="button" name="btnvalidar" id="btnvalidar" value="Validar Archivo" />
                </form>
            </div>
        </div>
    </div>
</body>
</html>s
