<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Discusión 3 - Diccionario interactivo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/discusion3.js"></script>
</head>
<body class="bg-light">
    <div class="container my-4">
        <div class="card shadow-sm p-4">
            <h2 class="card-title text-center mb-4">Diccionario de Español</h2>
            
            <form name="frmdiccionario" id="frmdiccionario" action="javascript:void(0)">
                <div class="row">
                    <!-- Columna Izquierda: Búsqueda y Cuadro de Lista -->
                    <div class="col-md-6 mb-3">
                        <div class="mb-3">
                            <label for="txtpalabra" class="form-label fw-bold">Palabra a buscar:</label>
                            <input type="text" class="form-control" id="txtpalabra" name="txtpalabra" placeholder="Escriba para filtrar..." />
                        </div>
                        
                        <div class="mb-3">
                            <label for="lstpalabras" class="form-label fw-bold">Palabras coincidentes:</label>
                            <select class="form-select" id="lstpalabras" name="lstpalabras" size="12">
                            </select>
                        </div>

                        <button type="button" class="btn btn-primary w-100" id="btnmostrar">Mostrar definición</button>
                    </div>

                    <!-- Columna Derecha: Resultado / Definición -->
                    <div class="col-md-6 mb-3">
                        <label for="txtdefinicion" class="form-label fw-bold">Definición:</label>
                        <textarea class="form-control" id="txtdefinicion" name="txtdefinicion" rows="15" readonly placeholder="Seleccione una palabra para ver su definición..."></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
