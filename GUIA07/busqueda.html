<!DOCTYPE html>
<html lang="es">
<head>
    <title>Deportes olímpicos</title>
    <meta charset="utf-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/busqueda.js"></script>
</head>
<body>
    <div class="jumbotron jumbotron-fluid bg-success text-white p-4">
        <div class="container">
            <h1 class="display-4">Deportes</h1>
            <p class="lead">¿Qué deporte olímpico te gusta más?</p>
        </div>
    </div>
    
    <div class="container mt-4">
        <form id="frmsearchsport" name="frmsearchsport">
            <fieldset id="box-form">
                <div class="form-group mb-2">
                    <label class="form-label" for="txtsport">Ingresa un deporte:</label>
                    <input class="form-control" type="text" id="txtsport" name="busca" size="24" />
                </div>
                
                <div class="form-group mb-2">
                    <label class="form-label" for="lstsports">Listado:</label>
                    <select class="form-control" name="lstsports" id="lstsports" size="10">
                    </select>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
