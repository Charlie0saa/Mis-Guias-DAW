<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Tiro de dados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="js/tirodados.js"></script>
</head>

<body class="bg-warning bg-gradient">

<div class="container-fluid">

    <div class="row mt-4">
        <div class="col-3"></div>

        </div>
    </div>

    <div class="row mt-4">
        <div class="col-3"></div>

        <div class="col">

            <ul class="list-group list-group-horizontal">

                <li class="list-group-item list-group-item-primary border-0">

                <li class="list-group-item list-group-item-primary border-0">
                    <img src="img/dice3.png" id="dado3" alt="Imagen del dado">

                <li class="list-group-item list-group-item-primary border-0">

                </li>

                <li class="list-group-item list-group-item-primary border-0">
                    <img src="img/dice5.png" id="dado5" alt="Imagen del dado">
                </li>

                <li class="list-group-item list-group-item-primary border-0">
                    <img src="img/dice6.png" id="dado6" alt="Imagen del dado">

            </ul>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
