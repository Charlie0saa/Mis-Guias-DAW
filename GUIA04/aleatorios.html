<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números aleatorios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="js/aleatorio.js"></script>
</head>

<body>

<div class="container-fluid">

    <div class="row bg-primary text-white p-3">
        <div class="col">
            <h1>Generación de números aleatorios</h1>
        </div>
    </div>

    <div class="row mt-3">

        <div class="col-4 ms-5">

            <form id="hongkiat-form">

                <div class="input-group mb-3">
                    <span class="input-group-text">Mínimo</span>
                    <input type="number" class="form-control" id="min">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Máximo</span>
                    <input type="number" class="form-control" id="max">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Cantidad</span>
                    <input type="number" class="form-control" id="cantidad">
                </div>

                <a href="#" id="generador" class="btn btn-primary">
                    Generar números
                </a>

            </form>

        </div>

    </div>

    <div class="row mt-3">
        <div class="col ms-5">
            <div id="listanumeros"></div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
