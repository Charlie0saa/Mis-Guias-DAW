<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Básica</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css\complementario2.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4">
            <h4 class="text-center mb-3 text-secondary">Calculadora</h4>
            
            <!-- Pantalla de la calculadora -->
            <input type="text" id="display" class="form-control form-control-lg text-end mb-3 bg-white" readonly value="0">

            <!-- Botones de la calculadora -->
            <div class="row g-2">
              <!-- Fila 1: Limpieza y operaciones especiales -->
              <div class="col-3"><button class="btn btn-danger w-100 fw-bold" onclick="limpiar()">C</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 fw-bold" onclick="calcularInversa()">1/x</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 fw-bold" onclick="calcularCuadrado()">x²</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 fw-bold" onclick="calcularRaiz()">√x</button></div>

              <!-- Fila 2 -->
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('7')">7</button></div>
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('8')">8</button></div>
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('9')">9</button></div>
              <div class="col-3"><button class="btn btn-primary w-100 fw-bold" onclick="seleccionarOperacion('/')">÷</button></div>

              <!-- Fila 3 -->
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('4')">4</button></div>
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('5')">5</button></div>
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('6')">6</button></div>
              <div class="col-3"><button class="btn btn-primary w-100 fw-bold" onclick="seleccionarOperacion('*')">×</button></div>

              <!-- Fila 4 -->
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('1')">1</button></div>
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('2')">2</button></div>
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('3')">3</button></div>
              <div class="col-3"><button class="btn btn-primary w-100 fw-bold" onclick="seleccionarOperacion('-')">-</button></div>

              <!-- Fila 5 -->
              <div class="col-3"><button class="btn btn-light border w-100" onclick="agregarNumero('0')">0</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 fw-bold" onclick="seleccionarOperacion('%')">%</button></div>
              <div class="col-3"><button class="btn btn-success w-100 fw-bold" onclick="procesarResultado()">=</button></div>
              <div class="col-3"><button class="btn btn-primary w-100 fw-bold" onclick="seleccionarOperacion('+')">+</button></div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js\complementario2.js"></script>
</body>
</html>
