<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de datos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="js/focusblur.js"></script>
</head>

<body>

<div class="container-fluid">

    <div class="row bg-light border-bottom">
        <div class="col text-center">
            <h1>Datos personales</h1>
        </div>
    </div>

    <div class="row mt-3">

        <div class="col-3"></div>

        <div class="col-4">
            <p id="textoAyuda" class="text-light bg-info rounded p-2"></p>
        </div>

        <div class="col"></div>

    </div>

    <form name="registro" id="hongkiat-form" action="javascript:void(0);">

        <div class="row">

            <div class="col-3"></div>

            <div class="col-4">

                <div class="input-group mb-2">
                    <span class="input-group-text">
                        <img src="images/user.png" alt="">
                    </span>

                    <input type="text"
                           class="form-control"
                           id="firstname"
                           name="nombre"
                           placeholder="Su nombre"
                           maxlength="25">

                    <span class="input-group-text">
                        <img src="images/user3.png" alt="">
                    </span>

                    <input type="text"
                           class="form-control"
                           id="lastname"
                           name="apellido"
                           placeholder="Su apellido"
                           maxlength="25">
                </div>

                <div class="input-group mb-2">

                    <span class="input-group-text">
                        <img src="images/email.png" alt="">
                    </span>

                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="Su correo electrónico">

                </div>

                <div class="input-group mb-2">

                    <span class="input-group-text">
                        <img src="images/phone.png" alt="">
                    </span>

                    <input type="tel"
                           class="form-control"
                           id="phone"
                           name="telefono"
                           placeholder="Su teléfono">

                </div>

                <div class="input-group mb-2">

                    <span class="input-group-text">
                        <img src="images/speech.png" alt="">
                    </span>

                    <textarea
                        id="describe"
                        class="form-control"
                        placeholder="Descríbete"></textarea>

                </div>

            </div>

            <div class="col-2">

                <h5>Profesión</h5>

                <select id="profesion" class="form-select mb-3">

                    <option>Médico</option>
                    <option>Ingeniero</option>
                    <option>Licenciado</option>
                    <option>Abogado</option>
                    <option>Docente</option>
                    <option>Técnico</option>

                </select>

                <h5>País</h5>

                <select id="selpais" class="form-select">

                    <option>El Salvador</option>
                    <option>Guatemala</option>
                    <option>Honduras</option>
                    <option>Costa Rica</option>
                    <option>Nicaragua</option>
                    <option>Panamá</option>

                </select>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-3"></div>

            <div class="col-8">

                <input type="reset"
                       id="resetbtn"
                       class="btn btn-secondary"
                       value="Cancelar">

                <input type="submit"
                       id="submitbtn"
                       class="btn btn-primary"
                       value="Registrar">

            </div>

        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
