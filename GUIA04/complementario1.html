<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina de Enlaces</title>
  <!-- CDN de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css\complementario1.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 text-center">
        
        <h1 class="mb-4 text-primary">Algunos Sitios de tu Interés</h1>
        <p class="text-muted mb-4">Hacer clic en uno de los enlaces para navegar a un sitio externo.</p>

        <!-- Lista de enlaces -->
        <div class="list-group shadow-sm">
          <a href="https://www.google.com" class="list-group-item list-group-item-action external-link p-3">
            <strong>Google</strong> <br>
            <small class="text-muted">Motor de búsqueda</small>
          </a>
          <a href="https://github.com" class="list-group-item list-group-item-action external-link p-3">
            <strong>GitHub</strong> <br>
            <small class="text-muted">Plataforma de desarrollo y código</small>
          </a>
          <a href="https://admacad.udb.edu.sv/PortalWeb/" class="list-group-item list-group-item-action external-link p-3">
            <strong>Portal U-D-B</strong> <br>
            <small class="text-muted">Para ir a ver si pasas las materias</small>
          </a>
          <a href="https://www.udbvirtual.edu.sv/auladigital/login/index.php" class="list-group-item list-group-item-action external-link p-3">
            <strong>Aula Digital</strong> <br>
            <small class="text-muted">Para que mires los sustos que las materias te dan</small>
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="js\complementario1.js"></script>
</body>
</html>
