<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Visor de imágenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/eventosteclas.js"></script>
</head>
<body>
    <div class="container text-center mt-5">
        <h2 class="mb-4">Visor de imágenes</h2>

        <div class="card d-inline-block p-3 shadow-sm">
            <img id="myPicture" src="img/lion.jpg" alt="Visor de fotos" class="img-fluid rounded" style="max-width: 500px; height: 350px; object-fit: cover;" />
        </div>

        <div class="mt-3 text-muted">
            <p>Pulse tecla <strong>[&larr;]</strong> para retroceder, pulse tecla <strong>[&rarr;]</strong> para avanzar.</p>
        </div>
    </div>
</body>
</html>
