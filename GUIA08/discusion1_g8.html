<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Discusión 1 - Visor de Imágenes Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/discusion1_g8.js"></script>
</head>
<body class="bg-light">
    <div class="container text-center mt-5">
        <h2 class="mb-4">Visor de Imágenes Interactivo</h2>

        <div class="card d-inline-block p-3 shadow-sm bg-white">
            <img id="myPicture" src="img/img1.jpg" alt="Visor de fotos" class="img-fluid rounded" style="max-width: 500px; height: 350px; object-fit: cover;" />
            
            <div class="mt-3">
                <p id="infoCounter" class="fw-bold text-secondary">Imagen 1 de 10</p>
            </div>

            <!-- Botones de formulario para avanzar y retroceder -->
            <form name="frmvisor" action="javascript:void(0)" class="mt-2">
                <input type="button" id="btnAnterior" class="btn btn-primary me-2" value="&larr; Atrás" />
                <input type="button" id="btnSiguiente" class="btn btn-primary" value="Adelante &rarr;" />
            </form>
        </div>

        <div class="mt-3 text-muted">
            <p>También puede pulsar la tecla <strong>[&larr;]</strong> para retroceder o <strong>[&rarr;]</strong> para avanzar.</p>
        </div>
    </div>
</body>
</html>
