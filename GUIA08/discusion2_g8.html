<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Discusión 2 - Formulario de Contacto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/discusion2_g8.js"></script>
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h2 class="card-title text-center mb-4">Formulario de Contacto</h2>

                    <form name="frmContacto" id="frmContacto" action="javascript:void(0)" novalidate>
                        <!-- Campo Nombre -->
                        <div class="mb-3">
                            <label for="txtNombre" class="form-label fw-bold">Nombre completo:</label>
                            <input type="text" class="form-control" id="txtNombre" name="txtNombre" placeholder="Ingrese su nombre" />
                            <div id="errorNombre" class="text-danger small mt-1" style="display: none;"></div>
                        </div>

                        <!-- Campo Correo -->
                        <div class="mb-3">
                            <label for="txtCorreo" class="form-label fw-bold">Correo electrónico:</label>
                            <input type="email" class="form-control" id="txtCorreo" name="txtCorreo" placeholder="ejemplo@correo.com" />
                            <div id="errorCorreo" class="text-danger small mt-1" style="display: none;"></div>
                        </div>

                        <!-- Campo Mensaje -->
                        <div class="mb-3">
                            <label for="txtMensaje" class="form-label fw-bold">Mensaje:</label>
                            <textarea class="form-control" id="txtMensaje" name="txtMensaje" rows="5" placeholder="Escriba su mensaje aquí..."></textarea>
                            <div id="errorMensaje" class="text-danger small mt-1" style="display: none;"></div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-50" id="btnEnviar">Enviar</button>
                            <button type="reset" class="btn btn-secondary w-50" id="btnLimpiar">Limpiar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
