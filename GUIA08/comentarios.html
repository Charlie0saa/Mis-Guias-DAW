<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Área de edición de texto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/keydown.js"></script>
</head>
<body>
    <div class="container text-center mt-4">
        <h1>Área de edición de texto</h1>
        <h2>Déjanos tus comentarios</h2>

        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="card bg-light p-4 text-start shadow-sm">
                    <p class="text-muted small">Instrucciones: CTRL+E para Editar y CTRL+S para Guardar, ESC para Cancelar.</p>
                    
                    <form name="frmcomentarios" id="frmcomentarios">
                        <div class="mb-3">
                            <label class="form-label" for="view">Tu mensaje:</label>
                            <div id="view" class="form-control bg-white" style="min-height: 80px;">Haz clic aquí o presiona CTRL+E para editar este comentario.</div>
                            <textarea id="area" class="form-control" style="display:none;"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="txtnombre">Nombre:</label>
                            <input class="form-control bg-white" type="text" id="txtnombre" name="txtnombre" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="txtcorreo">Correo electrónico:</label>
                            <input class="form-control bg-white" type="text" id="txtcorreo" name="txtcorreo" />
                        </div>

                        <button type="submit" class="btn btn-info text-white w-100 mt-2">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
