<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Documento de prueba CSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Vinculación del archivo CSS externo -->
    <link id="customStyle" rel="stylesheet" href="css/estilosdom.css">
</head>
<body class="container py-4">
    <header>
        <h1>Documento de prueba CSS</h1>
    </header>
    
    <section>
        <p>Esto es un párrafo de prueba.</p>
        <p>Aquí viene más texto engañoso.</p>
        <p>Hecho. No necesitamos seguir con esto.</p>
        <h3>Fin del documento de prueba</h3>
    </section>

    <div class="btn-group my-3" role="group">
        <button type="button" class="btn btn-success" id="enabled">Habilitar Hoja</button>
        <button type="button" class="btn btn-secondary" id="disabled">Deshabilitar Hoja</button>
        <button type="button" class="btn btn-warning" id="change">Modificar Regla</button>
        <button type="button" class="btn btn-danger" id="remove">Eliminar Regla</button>
        <button type="button" class="btn btn-primary" id="add">Añadir Regla</button>
    </div>

    <script src="js/estilosdom.js"></script>
</body>
</html>
