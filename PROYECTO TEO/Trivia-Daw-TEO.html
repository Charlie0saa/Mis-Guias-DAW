<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia de Deportes</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        
        <!-- Tarjeta de la Trivia -->
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4">
            
            <h3 class="text-center text-primary mb-3"> Trivia de Deportes </h3>
            
            <!-- Barra de progreso -->
            <div class="progress mb-3" style="height: 10px;">
              <div id="barraProgreso" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
            </div>

            <!-- Contenedor del juego -->
            <div id="contenedorJuego">
              <h5 id="textoPregunta" class="mb-4">Cargando pregunta...</h5>

              <!-- Contenedor donde JS insertará los botones de opciones -->
              <div id="contenedorOpciones" class="d-grid gap-2 mb-3"></div>

              <button id="btnSiguiente" class="btn btn-primary w-100 d-none">Siguiente Pregunta</button>
            </div>

            <!-- Contenedor de resultado final (oculto por defecto) -->
            <div id="contenedorResultado" class="text-center d-none">
              <h4 class="mb-3">¡Juego Terminado!</h4>
              <p id="textoPuntaje" class="fs-5"></p>
              <button class="btn btn-success w-100" onclick="location.reload()">Jugar de Nuevo</button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Ruta corregida con '/' -->
  <script src="js/trivia.js"></script>
</body>
</html>
