<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cálculo de Factorial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="js/factorial.js" defer></script>
</head>
<body class="container p-4">
  <div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-header bg-dark text-white fw-bold">3. Cálculo de Factorial</div>
    <div class="card-body">
      <div class="input-group mb-3">
        <input type="number" id="numFactorial" class="form-control" min="0" placeholder="Ej. 5">
        <button class="btn btn-primary" type="button" id="btnFactorial">Calcular</button>
      </div>
      <div id="resFactorial" class="alert alert-secondary p-2 d-none font-monospace small"></div>
    </div>
  </div>
</body>
</html>
