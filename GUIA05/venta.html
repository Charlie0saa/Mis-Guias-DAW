<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Registro de Ventas - Cajero</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="container py-4">
        <div class="row">
            <div class="col-12 text-center">
                <h1>Sistema de Ventas / Cajero</h1>
            </div>
        </div>

        <!-- Formulario para agregar producto -->
        <div class="row mt-4">
            <div class="col-12">
                <form action="javascript:void(0)" name="frmVenta" id="frmVenta">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-cart"></i></span>
                        <input type="text" class="form-control" name="txtProducto" id="txtProducto" placeholder="Nombre del producto" required />
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                        <input type="number" step="0.01" min="0.01" class="form-control" name="txtPrecio" id="txtPrecio" placeholder="Precio unitario ($)" required />
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-123"></i></span>
                        <input type="number" min="1" class="form-control" name="txtCantidad" id="txtCantidad" placeholder="Cantidad a llevar" required />
                    </div>

                    <div class="d-flex justify-content-center">
                        <button type="submit" id="btnAgregar" class="btn btn-primary w-25">Agregar a la venta</button>
                    </div>
                </form>
            </div>
        </div>

        <hr class="my-4">

        <!-- Tabla de productos agregados -->
        <div class="row">
            <div class="col-12">
                <h2 class="text-center">Detalle de la Venta</h2>
                <table class="table table-hover mt-3">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Producto</th>
                            <th>Precio Unitario ($)</th>
                            <th>Cantidad</th>
                            <th>Detalle / Subtotal ($)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbDetalleVenta">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                    <tfoot>
                        <tr class="table-secondary fw-bold fs-5">
                            <td colspan="4" class="text-end">Total Venta:</td>
                            <td id="lblTotalVenta" colspan="2">$0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script src="js/venta.js"></script>
</body>
</html>
