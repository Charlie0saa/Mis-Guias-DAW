<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Presupuesto Hospitalario</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="font-family: sans-serif;">

  <div class="jumbotron bg-light border">
    <h1 class="text-center text-dark mb-4">Distribución de Presupuesto Hospitalario</h1>
    <hr>
    
    <script>
      var presupuestoTotal, derma, trauma, pedia;

      // esta onda solicita el presupuesto
      presupuestoTotal = parseFloat(prompt('Ingrese el presupuesto total del hospital:', ''));

      if (isNaN(presupuestoTotal) || presupuestoTotal <= 0) {
        document.write("<div class='alert alert-danger h5 text-center'>Por favor, ingrese un monto válido.</div>");
      } else {
        // proceso
        derma = presupuestoTotal * 0.40;
        trauma = presupuestoTotal * 0.30;
        pedia = presupuestoTotal * 0.25;

        // lo redondeo
        function formatear(monto) {
          return Math.round(monto * 100) / 100;
        }

        // imprimir
        document.write("<h3 class='mb-3'>Presupuesto Total Ingresado: <span class='badge badge-secondary'>$ " + formatear(presupuestoTotal) + "</span></h3>");
        
        document.write("<div class='alert alert-info h5'> <strong>Dermatología (40%):</strong> $ " + formatear(derma) + "</div>");
        document.write("<div class='alert alert-warning h5'> <strong>Traumatología (30%):</strong> $ " + formatear(trauma) + "</div>");
        document.write("<div class='alert alert-success h5'> <strong>Pediatría (25%):</strong> $ " + formatear(pedia) + "</div>");
      }
    </script>
  </div>

</body>
</html>
