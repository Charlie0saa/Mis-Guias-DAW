                                <form id="formProducto">
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">Nombre del Producto</label>
                                        <input type="text" id="nombre" class="form-control" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="precio" class="form-label">Precio</label>
                                        <input type="number" step="0.01" class="form-control" id="precio" placeholder="0.00" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="cantidad" class="form-label">Cantidad</label>
                                        <input type="number" class="form-control" id="cantidad" placeholder="0" required>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-warning w-100">Agregar Producto</button> 
                                </form>
